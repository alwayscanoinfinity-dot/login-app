    <style>
        :root { --primary: #00ff00; --btn-bg: #000000; --btn-text: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        html, body { 
            background: #000; 
            color: #fff; 
            width: 100%; 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; 
            justify-content: center; 
        }
        
        .phone-inner { 
            width: 100%; 
            max-width: 480px; 
            min-height: 100vh; 
            padding: 50px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* Profil - Kunci Tengah */
        .pv-profile-locked { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .pv-avatar-wrapper { width: 100px; height: 100px; border-radius: 50%; padding: 4px; border: 2px dashed var(--primary); margin-bottom: 15px; }
        .pv-avatar-core { width: 100%; height: 100%; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .pv-avatar-core img { width: 100%; height: 100%; object-fit: cover; }
        
        h2 { font-size: 1.6rem; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Tagline Fix - Paksa Tengah */
        .pv-tag-container { 
            display: inline-block; 
            background: rgba(255,255,255,0.1); 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 13px; 
            color: #aaa; 
            border: 1px solid #333; 
            max-width: 80%;
            word-wrap: break-word;
        }

        /* Tautan */
        .pv-links-list { width: 100%; margin-top: 20px; }
        .pv-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--btn-bg); color: var(--btn-text); padding: 16px; border-radius: 12px; border: 1px solid #222; text-decoration: none; margin-bottom: 12px; font-weight: 500; font-size: 16px; }
        
        /* Sosmed */
        .pv-social-bar { display: flex; justify-content: center; gap: 20px; margin-top: 30px; margin-bottom: 20px; width: 100%; }
        .pv-social-bar a { color: #fff; font-size: 26px; opacity: 0.8; text-decoration: none; }
        
        /* Footer */
        .pv-footer { margin-top: auto; font-size: 11px; color: #444; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; }
        #pv-emoji-footer { font-size: 24px; margin-bottom: 5px; }
    </style>
